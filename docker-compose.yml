services:

  # ── Kafka (KRaft mode, no ZooKeeper) ──────────────────────────────────────
  kafka:
    image: apache/kafka:4.0.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── MinIO (S3-compatible object store) ────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the iceberg-warehouse bucket on first boot
  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/iceberg-warehouse &&
        echo 'Bucket ready.'
      "

  # ── Apache Polaris (Iceberg REST catalog) ────────────────────────────────
  polaris:
    image: apache/polaris:latest
    container_name: polaris
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://minio:9000
      QUARKUS_S3_PATH_STYLE_ACCESS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── Polaris bootstrap (creates catalog demo_lh, roles, grants) ───────────
  polaris-init:
    image: curlimages/curl:8.11.0
    container_name: polaris-init
    depends_on:
      polaris:
        condition: service_healthy
    volumes:
      - ./docker/polaris/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

  # ── Flink JobManager ──────────────────────────────────────────────────────
  flink-jobmanager:
    build:
      context: ./docker/flink
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.interval: 30000
    depends_on:
      polaris-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ── Flink TaskManager ─────────────────────────────────────────────────────
  flink-taskmanager:
    build:
      context: ./docker/flink
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.interval: 30000

  # ── Flink SQL Job (submits the SQL job then exits) ────────────────────────
  flink-sql-job:
    build:
      context: ./docker/flink
    container_name: flink-sql-job
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      polaris-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
    volumes:
      - ./docker/flink/jobs/sql:/sql
    command: >
      /bin/bash -c "
        echo 'Waiting for TaskManager to register...' &&
        sleep 20 &&
        /opt/flink/bin/sql-client.sh -f /sql/kafka_to_iceberg.sql
      "

  # ── Trino Coordinator ────────────────────────────────────────────────────
  trino-coordinator:
    image: trinodb/trino:468
    container_name: trino-coordinator
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/coordinator/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/coordinator/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/coordinator/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/coordinator/log.properties:/etc/trino/log.properties:ro
      - ./docker/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      polaris-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── Trino Worker ──────────────────────────────────────────────────────────
  trino-worker:
    image: trinodb/trino:468
    container_name: trino-worker
    volumes:
      - ./docker/trino/worker/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/worker/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/worker/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      trino-coordinator:
        condition: service_healthy

  # ── Jupyter Lab (Trino + Iceberg queries) ────────────────────────────────
  jupyter:
    build:
      context: ./docker/jupyter
    container_name: jupyter
    ports:
      - "8888:8888"
    depends_on:
      polaris-init:
        condition: service_completed_successfully
    volumes:
      - ./docker/jupyter/notebooks:/home/jupyter
    networks:
      - default

  # ── Evidence BI (dashboard) ───────────────────────────────────────────────
  evidence:
    build:
      context: ./docker/evidence
    container_name: evidence
    ports:
      - "3000:3000"
    volumes:
      - ./docker/evidence/pages:/app/pages
      - ./docker/evidence/sources:/app/sources
    depends_on:
      polaris-init:
        condition: service_completed_successfully
      trino-coordinator:
        condition: service_healthy

  # ── Grafana (Iceberg monitoring dashboard) ───────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: trino-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: trino-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/iceberg-monitoring.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      trino-coordinator:
        condition: service_healthy

  # ── Kafka producer (Python, sends synthetic events) ───────────────────────
  kafka-producer:
    build:
      context: ./docker/producer
    container_name: kafka-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./docker/producer/producer.py:/app/producer.py:ro